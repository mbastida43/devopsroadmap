<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Infinity Roadmap - Interactive 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-soft: #f0f4f8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        body {
            background: radial-gradient(circle at top left, #e0f2fe 0%, #f1f5f9 50%, #f5f3ff 100%);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1e293b;
            overflow-x: hidden;
        }

        .infinity-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .roadmap-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            perspective: 1000px;
        }

        @media (max-width: 1024px) {
            .roadmap-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 640px) {
            .roadmap-grid { grid-template-columns: 1fr; }
        }

        .phase-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 20px 20px 60px #d1d9e6,-20px -20px 60px #ffffff;
            transition: transform 0.1s ease-out;
        }

        .phase-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:20px;
        }

        .icon-3d { font-size:3.5rem; }

        .logo-container {
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:center;
        }

        .tool-tag {
            background:#fff;
            padding:8px 14px;
            border-radius:16px;
            font-size:0.8rem;
            display:flex;
            gap:8px;
            align-items:center;
            text-decoration:none;
            color:#475569;
        }
    </style>
</head>

<body>

<div class="infinity-container">

<div class="roadmap-grid">

<!-- PLAN -->
<div class="phase-card">
    <div class="phase-title">PLAN</div>
    <div class="icon-wrapper">
        <i class="fas fa-diagram-project icon-3d text-blue-500"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fab fa-jira"></i> Jira</span>
        <span class="tool-tag"><i class="fas fa-book"></i> Confluence</span>
        <span class="tool-tag"><i class="fas fa-tasks"></i> Azure Boards</span>
    </div>
</div>

<!-- CODE -->
<div class="phase-card">
    <div class="phase-title">CODE</div>
    <div class="icon-wrapper">
        <i class="fas fa-code icon-3d text-indigo-600"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fas fa-terminal"></i> VSCode</span>
        <span class="tool-tag"><i class="fab fa-python"></i> Python</span>
        <span class="tool-tag"><i class="fab fa-git-alt"></i> Git</span>
    </div>
</div>

<!-- BUILD -->
<div class="phase-card">
    <div class="phase-title">BUILD</div>
    <div class="icon-wrapper">
        <i class="fas fa-box icon-3d text-orange-600"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fas fa-gears"></i> Maven</span>
        <span class="tool-tag"><i class="fas fa-gears"></i> Gradle</span>
    </div>
</div>

<!-- TEST -->
<div class="phase-card">
    <div class="phase-title">TEST</div>
    <div class="icon-wrapper">
        <i class="fas fa-vial icon-3d text-emerald-600"></i>
    </div>
    <div class="logo-container">
        <a href="https://playwright.dev" target="_blank" class="tool-tag">
            <i class="fas fa-robot"></i> Playwright
        </a>
        <span class="tool-tag"><i class="fas fa-globe"></i> Selenium</span>
        <span class="tool-tag"><i class="fas fa-shield-halved"></i> SonarQube</span>
    </div>
</div>

<!-- RELEASE -->
<div class="phase-card">
    <div class="phase-title">RELEASE</div>
    <div class="icon-wrapper">
        <i class="fas fa-tags icon-3d text-rose-600"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fab fa-git-alt"></i> Git Tags</span>
        <span class="tool-tag"><i class="fas fa-box-archive"></i> Artifactory</span>
    </div>
</div>

<!-- DEPLOY -->
<div class="phase-card">
    <div class="phase-title">DEPLOY</div>
    <div class="icon-wrapper">
        <i class="fas fa-paper-plane icon-3d text-cyan-600"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fab fa-jenkins"></i> Jenkins</span>
        <span class="tool-tag"><i class="fab fa-github"></i> Actions</span>
        <span class="tool-tag"><i class="fas fa-infinity"></i> Azure Pipelines</span>
    </div>
</div>

<!-- OPERATE -->
<div class="phase-card">
    <div class="phase-title">OPERATE</div>
    <div class="icon-wrapper">
        <i class="fas fa-server icon-3d text-blue-700"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fab fa-docker"></i> Docker</span>
        <span class="tool-tag"><i class="fas fa-dharmachakra"></i> Kubernetes</span>
    </div>
</div>

<!-- MONITOR -->
<div class="phase-card">
    <div class="phase-title">MONITOR / OBSERVABILITY</div>
    <div class="icon-wrapper">
        <i class="fas fa-microscope icon-3d text-purple-700"></i>
    </div>
    <div class="logo-container">
        <span class="tool-tag"><i class="fas fa-fire"></i> Prometheus</span>
        <span class="tool-tag"><i class="fas fa-chart-line"></i> Grafana</span>
    </div>
</div>

</div>

</div>

</body>
</html>
